# Docker Compose configuration for local development environment
#
# Usage:
#   - `docker compose up`: Start all services in the foreground
#   - `docker compose up -d`: Start all services in the background
#   - `docker compose down`: Stop and remove all services
#   - `docker compose ps`: List running services

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: card-erp-postgres
    environment:
      POSTGRES_USER: card_erp_user
      POSTGRES_PASSWORD: card_erp_password
      POSTGRES_DB: card_erp
    ports:
      - "5678:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_erp_user -d card_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: card-erp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
